bio:
  - >-
    On a dark night at sea, I watched the water around my ship turn neon blue-green as the
    propellers stirred up a colony of bioluminescent algae. That sight stayed with me through two
    decades at sea, and the tiny organisms behind it are what I study today. I am a PhD candidate in
    the Morton K. Blaustein Department of Earth and Planetary Sciences at Johns Hopkins University,
    advised by Prof. Anand Gnanadesikan with co-advisors Prof. Ján Drgoňa and Prof. Somdatta
    Goswami. My research uses scientific machine learning (SciML) to learn how phytoplankton respond
    to their environment from 27 years of multi-satellite ocean-colour observations. I used a Fourier Neural Operator (FNO)
    emulator, weak-form sparse equation discovery and a physics-informed inverse model for my research
    to improve the ocean biogeochemical models. I expect to defend my
    doctorate in early 2027.
  - >-
    Before the PhD, I was a meteorological and oceanographic officer in the Indian
    Navy. I started in an era when weather charts were still drawn by hand, and I watched numerical
    modelling and then machine learning reshape forecasting. In my final years of service I led an
    operational forecasting centre that ran weather, ocean and wave models, and introduced data
    assimilation that measurably improved forecast skill. The work also reached beyond forecasting,
    into search and rescue, disaster relief and the protection of coastal and marine ecosystems.
  - >-
    Machine learning drew me in, partly because it rekindled a love of mathematics. Serving at remote postings with poor connectivity, I taught
    myself Python and data science. I went on to build forecasting models used in daily operations,
    including a hybrid numerical-model and ML approach for thunderstorms and fog, a
    CNN-LSTM for heavy rainfall, and deep-learning models for wave height. The success of those
    hybrid methods is why I took a mid-career break to pursue a PhD where machine learning meets
    ocean science. In 2026, my team DarwinsLabs was named a Pitch Event Runner-Up in the NASA Space
    to Soil Challenge for SoilSentinel, a CubeSat concept that distils the NASA and IBM
    Prithvi-EO-2.0 geospatial foundation model into a 1.19M-parameter model small enough to run on
    board.

